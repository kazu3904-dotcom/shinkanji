<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanji Memory Card Game</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      font-family: "Yu Gothic", Meiryo, sans-serif; color: #263238;
      background: linear-gradient(135deg, #fff7d6, #dff3ff);
      overscroll-behavior: none;
    }
    main {
      width: min(1080px, 100%); margin: auto; padding: clamp(14px, 3vw, 26px);
      text-align: center; background: rgba(255,255,255,.96);
      border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    h1 { margin: 5px 0 12px; color: #1565c0; font-size: clamp(1.65rem, 5vw, 2.45rem); }
    p { line-height: 1.5; }
    .menu, .board, .choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .menu > *, .board > *, .choices > * { min-width: 0; overflow-wrap: anywhere; }
    button {
      min-height: 52px; border: 0; border-radius: 16px; padding: 14px 10px;
      color: #fff; font: inherit; font-weight: bold; cursor: pointer;
      background: #1976d2; box-shadow: 0 4px 0 rgba(0,0,0,.2);
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    button:focus-visible { outline: 4px solid #ffca28; outline-offset: 3px; }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
    .menu button { min-height: 82px; font-size: 1.1rem; }
    .menu button:nth-child(2) { background: #ec407a; }
    .menu button:nth-child(3) { background: #43a047; }
    .menu button:nth-child(4) { background: #fb8c00; }
    .menu button:nth-child(5) { background: #673ab7; }
    .menu button:nth-child(6) { background: #00838f; }
    .settings-title { margin: 8px 0; }
    .choices { margin: 10px 0; }
    .choices.two { grid-template-columns: repeat(2, 1fr); }
    .choices.three { grid-template-columns: repeat(3, 1fr); }
    .choices button { color: #263238; background: #f3f5f7; box-shadow: 0 3px 0 #b0bec5; }
    .choices button.selected { background: #fbc02d; box-shadow: 0 3px 0 #e09b00; }
    .start-note { color: #795548; font-weight: bold; }
    .toolbar {
      position: sticky; top: max(6px, env(safe-area-inset-top)); z-index: 2;
      display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px;
    }
    .toolbar button { padding: 10px 14px; }
    .status { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 14px; font-weight: bold; }
    .status span { padding: 8px 12px; border-radius: 999px; background: #eef5ff; }
    #players { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
    #players span { padding: 8px 14px; border-radius: 999px; background: #eceff1; font-weight: bold; }
    #players span.turn { color: #5d4037; background: #ffd54f; }
    .card {
      position: relative; min-height: clamp(92px, 13vw, 138px); color: transparent;
      font-size: clamp(1.05rem, 3vw, 1.7rem); background: linear-gradient(145deg,#42a5f5,#1565c0);
    }
    .card::after {
      content: "?"; position: absolute; inset: 0; display: grid;
      place-items: center; color: #fff; font-size: 2rem;
    }
    .card.open, .card.matched { color: #263238; background: #fff; }
    .card.open::after, .card.matched::after { content: ""; }
    .card.matched { background: #dcedc8; cursor: default; }
    #message { min-height: 1.6em; color: #e65100; font-weight: bold; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      body { padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
      main { padding: 13px; border-radius: 18px; }
      .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .menu button { min-height: 68px; }
      .choices, .choices.three { grid-template-columns: minmax(0, 1fr); gap: 9px; }
      .choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .card { min-height: 105px; padding: 6px; font-size: clamp(1.1rem, 7vw, 1.75rem); }
      .card::after { font-size: 2.4rem; }
      .toolbar button { flex: 1; }
      .status { margin: 10px 0; }
    }
    @media (min-width: 761px) and (max-width: 1100px) {
      main { width: 100%; }
      .menu { grid-template-columns: repeat(3, 1fr); }
      .card { min-height: clamp(100px, 14vw, 145px); }
    }
    @media (max-height: 520px) and (orientation: landscape) {
      body { padding-top: 5px; }
      main { padding: 9px 12px; }
      h1 { margin: 0 0 4px; font-size: 1.4rem; }
      p { margin: 5px 0; }
      .board { grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .card { min-height: 66px; font-size: 1.05rem; }
      .toolbar { margin-bottom: 5px; }
      .toolbar button { min-height: 42px; padding: 6px 10px; }
      .status { margin: 5px 0; }
    }
  </style>
</head>

    function startGame(pairCount) {
      first = null; second = null; locked = false; tries = 0; matched = 0;
      currentPlayer = 0; scores = [0, 0];
      activePairs = currentGame.pairs.slice();
      shuffle(activePairs);
      var usedReadings = {};
      activePairs = activePairs.filter(function(pair) {
        if (usedReadings[pair[1]]) return false;
        usedReadings[pair[1]] = true;
        return true;
      });
      activePairs = activePairs.slice(0, Math.min(pairCount, activePairs.length));
      document.getElementById("gameTitle").textContent = currentGame.title;
      document.getElementById("description").textContent = currentGame.desc;
      document.getElementById("tries").textContent = "0";
      document.getElementById("pairs").textContent = "0 / " + activePairs.length;
      document.getElementById("message").textContent = "";
      board.innerHTML = "";
      var deck = [];
      activePairs.forEach(function(pair, id) {
        deck.push({id:id, text:pair[0]});
        deck.push({id:id, text:pair[1]});
      });
      shuffle(deck).forEach(function(item) {
        var card = document.createElement("button");
        card.className = "card";
        card.textContent = item.text;
        card.setAttribute("data-pair", item.id);
        card.onclick = function() { choose(card); };
        board.appendChild(card);
      });
      menuScreen.hidden = true;
      settingsScreen.hidden = true;
      gameScreen.hidden = false;
      updatePlayers();
    }

    function choose(card) {
      if (locked || card === first || card.classList.contains("matched")) return;
      playFlipSound();
      card.classList.add("open");
      if (!first) { first = card; return; }
      second = card;
      tries++;
      document.getElementById("tries").textContent = tries;
      if (first.getAttribute("data-pair") === second.getAttribute("data-pair")) {
        playCorrectSound();
        first.classList.add("matched"); second.classList.add("matched");
        first = null; second = null; matched++;
        if (selectedMode === 2) scores[currentPlayer]++;
        updatePlayers();
        document.getElementById("pairs").textContent = matched + " / " + activePairs.length;
        if (matched === activePairs.length) {
          if (selectedMode === 2) {
            document.getElementById("message").textContent = scores[0] === scores[1] ? "\u5f15\u304d\u5206\u3051\uff01" : "\u30d7\u30ec\u30a4\u30e4\u30fc" + (scores[0] > scores[1] ? "1" : "2") + "\u306e\u52dd\u3061\uff01";
          } else {
            document.getElementById("message").textContent = "\u30af\u30ea\u30a2\uff01";
          }
        }
      } else {
        playWrongSound();
        locked = true;
        setTimeout(function() {
          first.classList.remove("open"); second.classList.remove("open");
          first = null; second = null; locked = false;
          if (selectedMode === 2) currentPlayer = currentPlayer === 0 ? 1 : 0;
          updatePlayers();
        }, 800);
      }
    }

    games.forEach(function(game, index) {
      var button = document.createElement("button");
      button.textContent = game.title;
      button.onclick = function() { showSettings(index); };
      menu.appendChild(button);
    });
    document.getElementById("backButton").onclick = showMenu;
    document.getElementById("settingsBackButton").onclick = showMenu;
    document.getElementById("resetButton").onclick = function() { showSettings(currentIndex); };
    Array.prototype.forEach.call(document.querySelectorAll("#modeChoices button"), function(button) {
      button.onclick = function() {
        selectedMode = Number(button.getAttribute("data-mode"));
        chooseSetting(document.getElementById("modeChoices"), button);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("#difficultyChoices button"), function(button) {
      button.onclick = function() { startGame(Number(button.getAttribute("data-difficulty"))); };
    });
  </script>
</body>
</html>
